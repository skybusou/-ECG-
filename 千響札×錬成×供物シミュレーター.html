      const iconHtml = hideIcon ? '' : `<span>${getColorDot(c.name)}</span>`;
      return `
        <button type="button" class="${getChipClasses(c.name)}${isNew ? ' chip-new' : ''} shrink-0" onclick="showCardDetail(${uid})">
          ${iconHtml}
          <span>《${formatColoredCardName(c.name)}》</span>
          ${noteHtml}
        </button>
      `;
    }

    // 場専用チップ：カード名を1行目、付随データ（盾・予約・重ね・新規）を2行目に表示する
    function renderFieldChip(uid, notes, isNew) {
      const c = getCard(G, uid);
      const subHtml = notes.length
        ? `<span class="field-card-sub">${notes.join(' ・ ')}</span>`
        : '';
      return `
        <button type="button" class="${getChipClasses(c.name)} field-card${isNew ? ' chip-new' : ''} shrink-0" onclick="showCardDetail(${uid})">
          <span class="field-card-main">
            <span>${getColorDot(c.name)}</span>
            <span>《${formatColoredCardName(c.name)}》</span>
          </span>
          ${subHtml}
        </button>
      `;
    }

    function renderCauldronRow(side) {
      const p = G.players[side];
      const caul = p.cauldrons[0];
      const maxSlots = 1 + caul.upgrades.filter(id => getCard(G, id).name.includes('腐蝕')).length;
      const upgText = caul.upgrades.length > 0 ? caul.upgrades.map(id => alcLabel(getCard(G, id).name)).join('・') : 'なし';
      const attText = caul.attachments.length > 0 ? caul.attachments.map(id => `${CARD_DEFS[getCard(G, id).name].label}${caul.attachmentActive[id] ? '(済)' : '(未)'}`).join('・') : 'なし';
      const cntText = caul.contents.length > 0 ? caul.contents.map(id => `${alcLabel(getCard(G, id).name)}${getCard(G, id).reservedProduct ? '[予約]' : ''}`).join('・') : 'なし';
      const extraPots = p.cauldrons.length > 1 ? ` ＋ 第2器(枠${p.cauldrons[1].contents.length}/1)` : '';
      const shelfCap = p.shelf ? 1 + (p.shelf.upgrades.some(id => getCard(G, id).name.includes('腐蝕')) ? 1 : 0) : 0;
      const shelfUpg = p.shelf && p.shelf.upgrades.length > 0 ? `｜棚強化:${p.shelf.upgrades.map(id => alcLabel(getCard(G, id).name)).join('・')}` : '';
      const shelfText = p.shelf ? ` ｜ 保管棚(${p.shelf.contents.length}/${shelfCap}${shelfUpg})` : '';

      return `
        <div class="alchemy-wide-row">
          <button type="button" class="chip-card fill-gold sys-alchemy alchemy-wide-chip" onclick="showCauldronDetail(${side})">
            <span class="alchemy-wide-main">
              <span>🟡</span>
              <span style="color:#eab308">《錬成釜：錬成》</span>
            </span>
            <span class="alchemy-wide-sub">枠 ${caul.contents.length}/${maxSlots} ｜ 強化：${upgText} ｜ 付属：${attText} ｜ 中身：${cntText}${extraPots}${shelfText}</span>
          </button>
        </div>
      `;
    }

    function renderPlayerBlock(side, isOpponent) {
      const p = G.players[side];
      const baseP = BASELINE ? BASELINE.players[side] : null;
      const baseHandSet = new Set(baseP ? baseP.hand : p.hand);
      const baseFieldSet = new Set(baseP ? baseP.field : p.field);
      const hpDelta = baseP ? p.hp - baseP.hp : 0;
      const hpBadge = hpDelta !== 0
        ? ` <span class="font-black ${hpDelta < 0 ? 'text-rose-400' : 'text-emerald-400'}">（${hpDelta > 0 ? '+' : ''}${hpDelta}）</span>`
        : '';
      const turnBadge = side === 0
        ? `<span class="font-extrabold px-1.5 py-0 rounded bg-indigo-600 text-white">先攻</span>`
        : `<span class="font-extrabold px-1.5 py-0 rounded bg-slate-700 text-slate-200">後攻</span>`;

      let handHtml = '';
      if (!isOpponent || PUBLIC_MODE) {
        handHtml = p.hand.length > 0
          ? p.hand.map(uid => {
              const isNew = !baseHandSet.has(uid);
              return renderCardChip(uid, isNew ? '(新規)' : '', isNew, true);
            }).join('<span class="text-slate-500 text-xs">、</span>')
          : '<span class="text-slate-400">0枚</span>';
      } else {
        handHtml = `<span class="text-slate-400 text-[11px]">非公開</span>`;
      }

      const fieldHtml = p.field.length > 0
        ? p.field.map(uid => {
            const c = getCard(G, uid);
            const notes = [];
            if (c.shields > 0) notes.push(`盾${c.shields}`);
            if (c.whiteBuffAura) notes.push(`白バフ無敵`);
            if (['攻撃','溜撃','攻撃×防御','攻撃×重鎧','攻撃×対策','溜撃×対策','燃え尽きる重砲：攻撃×攻撃×重鎧','二連の穿孔撃：攻撃×攻撃×対策','自らを削る貫き：攻撃×対策×対策'].includes(c.name) && !c.onceUsed) {
              notes.push(`予約`);
            }
            if (c.stackedCards.length > 0) notes.push(`重ね${c.stackedCards.length}`);
            const isNew = !baseFieldSet.has(uid);
            if (isNew) notes.push('新規');
            return renderFieldChip(uid, notes, isNew);
          }).join(' ')
        : '<span class="text-slate-400">なし</span>';

      const handRowHtml = (!isOpponent || PUBLIC_MODE) ? `
        <!-- 上段：手札（1行・全幅。先攻/後攻とHPは場の見出しへ移したため、長い超越カード名も見切れにくい）
             ラベルは左の「手札：」ではなく、カード群の右側に「：手札」と表示する。
             相手は手札枚数が場の見出し行の右端に出るため、非公開時の行は表示しない（公開時のみ中身を見る行を出す） -->
        <div class="flex items-center gap-1 overflow-x-auto border-b border-slate-700/80 pb-0.5 whitespace-nowrap text-xs text-slate-300">
          ${handHtml}
          <span class="hand-label-right shrink-0">：手札</span>
        </div>` : '';

      return `
        ${handRowHtml}

        <!-- 通常の場（見出し行に先攻/後攻とHPを表示。相手は手札枚数を右詰めで表示。カードの付随データは各カードの2行目） -->
        <div class="space-y-1 text-xs">
          <div class="field-head-row flex flex-wrap items-center gap-1.5">
            <span class="text-slate-400 shrink-0">場：</span>
            ${isOpponent ? '<span class="font-bold text-slate-300">相手</span>' : ''}
            ${turnBadge}
            <span class="text-slate-500">｜</span>
            <span class="text-slate-300 font-bold">HP: <strong class="text-sm font-black text-white">${p.hp}</strong>${hpBadge} <span class="text-slate-400 font-normal">/ 13</span></span>
            ${isOpponent ? `<span class="opp-hand-count shrink-0 text-slate-300">手札：<strong class="text-white">${p.hand.length}枚</strong></span>` : ''}
          </div>
          <div class="flex flex-wrap items-start gap-1.5">
            ${fieldHtml}
          </div>
        </div>

        <!-- 拡張領域（供物置き場・錬成釜） -->
        <div class="space-y-1 text-xs">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="text-[#fb7185] font-bold shrink-0">🩸 供物置き場：</span>
            <button type="button" class="chip-card fill-crimson sys-offering" onclick="showCardDetail(${p.altarUid})">
              <span>🩸</span>
              <span style="color:#fb7185">《供物》</span>
              <span class="font-semibold text-slate-200">（祭壇）</span>
            </button>
          </div>
          ${renderCauldronRow(side)}
        </div>
      `;
    }

    // 「前回からの変化」区間：自分の前回の手番終了（INTERVAL_BASE）→ 今の手番開始（現在）
    // 上段チップ用：区間内に実際に起きた差分だけを、状態比較から作る
    function shieldTotalFor(snap, side) {
      const p = snap.players[side];
      if (!p) return 0;
      let total = 0;
      const cardOf = uid => snap.cards[uid - 1];
      p.field.forEach(uid => {
        const c = cardOf(uid);
        if (!c) return;
        total += Number(c.shields) || 0;
        if (c.name === '重鎧×対策' && Array.isArray(c.stackedCards) && c.stackedCards.length > 0) total += 1;
      });
      p.cauldrons.forEach(caul => {
        (caul.upgrades || []).forEach(uid => {
          const c = cardOf(uid);
          if (c && c.name.includes('重鎧')) total += 1;
        });
      });
      if (p.shelf) {
        (p.shelf.upgrades || []).forEach(uid => {
          const c = cardOf(uid);
          if (c && c.name.includes('重鎧')) total += 1;
        });
      }
      return total;
    }

    function computeIntervalChips() {
      if (!INTERVAL_BASE) return [{ kind: 'none', label: '対戦開始直後です — まだ相手の手番は来ていません' }];
      const END = INTERVAL_END_BASE || G;
      const chips = [];
      const nameOf = (snap, uid) => snap.cards[uid - 1] ? snap.cards[uid - 1].name : '?';
      const who = side => side === G.humanSide ? 'あなた' : '相手';
      const whoShort = side => side === G.humanSide ? '自分' : '相手';
      // HP（自分 → 相手の順で見せる）
      [G.humanSide, 1 - G.humanSide].forEach(side => {
        const b = INTERVAL_BASE.players[side];
        const n = END.players[side];
        if (!b || !n) return;
        if (n.hp !== b.hp) {
          const d = n.hp - b.hp;
          chips.push({
            kind: d < 0 ? 'hp-down' : 'hp-up',
            label: `${who(side)} HP ${b.hp} → ${n.hp}`,
            detail: `${d > 0 ? '+' : ''}${d}`
          });
        }
      });
      // 場：現れたカード／壊れた（場を離れた）カード、盾の増減
      [G.humanSide, 1 - G.humanSide].forEach(side => {
        const b = INTERVAL_BASE.players[side];
        const n = END.players[side];
        if (!b || !n) return;
        const bField = new Set(b.field);
        const nField = new Set(n.field);
        n.field.filter(uid => !bField.has(uid)).forEach(uid => {
          chips.push({ kind: 'appear', label: `${whoShort(side)}の場に登場`, name: nameOf(END, uid) });
        });
        b.field.filter(uid => !nField.has(uid)).forEach(uid => {
          chips.push({ kind: 'destroyed', label: `${whoShort(side)}の場から壊れた／離れた`, name: nameOf(INTERVAL_BASE, uid) });
        });
        const bSh = shieldTotalFor(INTERVAL_BASE, side);
        const nSh = shieldTotalFor(END, side);
        if (nSh !== bSh) {
          const d = nSh - bSh;
          chips.push({ kind: d > 0 ? 'shield-up' : 'shield-down', label: `${who(side)} 盾 ${bSh} → ${nSh}`, detail: `${d > 0 ? '+' : ''}${d}` });
        }
        if ((n.alcDefenseShield || 0) !== (b.alcDefenseShield || 0)) {
          chips.push({ kind: 'shield-up', label: `${who(side)} 錬成防御軽減 ${b.alcDefenseShield || 0} → ${n.alcDefenseShield || 0}` });
        }
        // 相手の手札枚数の変化（中身は非公開のまま、枚数だけ）
        if (side !== G.humanSide && n.hand.length !== b.hand.length) {
          const d = n.hand.length - b.hand.length;
          chips.push({ kind: 'shared', label: `相手 手札 ${b.hand.length} → ${n.hand.length}枚`, detail: `${d > 0 ? '+' : ''}${d}` });
        }
      });
      // 錬成釜・保管棚：生成・破壊・強化／付属／中身の付け外し
      [G.humanSide, 1 - G.humanSide].forEach(side => {
        const b = INTERVAL_BASE.players[side];
        const n = END.players[side];
        if (!b || !n) return;
        if (n.cauldrons.length !== b.cauldrons.length) {
          chips.push({
            kind: 'cauldron',
            label: n.cauldrons.length > b.cauldrons.length
              ? `${who(side)} 錬成釜が増えた ${b.cauldrons.length} → ${n.cauldrons.length}器`
              : `${who(side)} 錬成釜が壊れた ${b.cauldrons.length} → ${n.cauldrons.length}器`
          });
        }
        const collect = p => {
          const items = [];
          p.cauldrons.forEach((c, idx) => {
            (c.contents || []).forEach(uid => items.push([`釜${idx + 1}・中身`, uid]));
            (c.upgrades || []).forEach(uid => items.push([`釜${idx + 1}・強化`, uid]));
            (c.attachments || []).forEach(uid => items.push([`釜${idx + 1}・付属`, uid]));
          });
          if (p.shelf) {
            (p.shelf.contents || []).forEach(uid => items.push(['保管棚・中身', uid]));
            (p.shelf.upgrades || []).forEach(uid => items.push(['保管棚・強化', uid]));
          }
          return items;
        };
        const bItems = collect(b);
        const nItems = collect(n);
        const bKeys = new Set(bItems.map(([k, uid]) => `${k}:${uid}`));
        const nKeys = new Set(nItems.map(([k, uid]) => `${k}:${uid}`));
        nItems.filter(([k, uid]) => !bKeys.has(`${k}:${uid}`)).forEach(([k, uid]) => {
          const isShelf = k.startsWith('保管棚');
          chips.push({ kind: isShelf ? 'shelf' : 'cauldron', label: `${whoShort(side)} ${k} に入った`, name: alcLabel(nameOf(END, uid)) });
        });
        bItems.filter(([k, uid]) => !nKeys.has(`${k}:${uid}`)).forEach(([k, uid]) => {
          const isShelf = k.startsWith('保管棚');
          chips.push({ kind: isShelf ? 'shelf' : 'cauldron', label: `${whoShort(side)} ${k} から出た／外れた`, name: alcLabel(nameOf(INTERVAL_BASE, uid)) });
        });
        const bShelf = !!b.shelf;
        const nShelf = !!n.shelf;
        if (bShelf !== nShelf) {
          chips.push({ kind: 'shelf', label: nShelf ? `${who(side)} 保管棚ができた` : `${who(side)} 保管棚が壊れた` });
        }
      });
      // 共有捨て札
      const dDiscard = END.discard.length - INTERVAL_BASE.discard.length;
      if (dDiscard !== 0) {
        chips.push({ kind: 'shared', label: `共有捨て札 ${INTERVAL_BASE.discard.length} → ${END.discard.length}枚`, detail: `${dDiscard > 0 ? '+' : ''}${dDiscard}` });
      }
      if (chips.length === 0) chips.push({ kind: 'none', label: 'この区間で盤面に変化はありませんでした' });
      return chips;
    }

    // 下段用：区間の出来事を時系列で（全ログの通し番号つき）。長い場合は直近を優先する
    function getIntervalEvents() {
      const chronological = [...G.logs].reverse();
      const start = Math.max(0, Math.min(INTERVAL_LOG_LEN, chronological.length));
      const end = INTERVAL_LOG_END > start ? Math.min(INTERVAL_LOG_END, chronological.length) : chronological.length;
      const raw = chronological.slice(start, end).map((text, i) => ({ num: start + i + 1, text }));
      // ターン終了時の状態スナップショット行は要約専用なので、時系列からは除く（番号は通しのまま残る）
      const events = raw.filter(e => !e.text.includes('【ターン終了状態】'));
      const MAX_SHOW = 14;
      const hiddenCount = Math.max(0, events.length - MAX_SHOW);
      const shown = hiddenCount > 0 ? events.slice(-MAX_SHOW) : events;
      return { total: events.length, shown, hiddenCount };
    }

    function render() {
      const oppSide = 1 - G.humanSide;

      // 1. 共有領域
      const discardSummary = G.discard.length > 0
        ? `（上：${G.discard.slice(0, 4).map(id => getCard(G, id).name).join('・')}${G.discard.length > 4 ? '…' : ''}）`
        : '';
      document.getElementById('sharedZone').innerHTML = `
        <div class="flex flex-wrap items-center gap-x-1.5 gap-y-0.5 text-slate-200">
          <button type="button" onclick="showSharedDetail()" class="text-left hover:underline">
            <span>共有デッキ：<strong class="text-white">${G.deck.length}枚</strong></span>
            <span class="text-slate-500">／</span>
            <span>共有捨て札：<strong class="text-white">${G.discard.length}枚</strong><span class="text-slate-400">${discardSummary}</span></span>
            <span class="text-slate-500">／</span>
            <span>
              待機在庫：基本 <strong class="text-white">${G.standbyBase.length}枚</strong> ｜
              🟡<span class="text-[#eab308] font-bold">錬成</span> <strong class="text-[#eab308]">${G.standbyAlc.length}枚</strong> ｜
              🩸<span class="text-[#fb7185] font-bold">供物</span> <strong class="text-[#fb7185]">${G.standbyOff.length}枚</strong>
              <span class="text-slate-400 ml-1">[乱数位置:${G.rngPos}]</span>
            </span>
          </button>
        </div>
      `;

      // 2. 相手パネル & 3. 自分パネル
      document.getElementById('oppPanel').innerHTML = renderPlayerBlock(oppSide, true);
      document.getElementById('mePanel').innerHTML = renderPlayerBlock(G.humanSide, false);

      // 前回からの変化（区間：自分の前回の手番終了 → 今の手番開始）
      // 上段：要約チップ
      const intervalChips = computeIntervalChips();
      document.getElementById('changesChips').innerHTML = intervalChips.map(chip => {
        const kindClass = {
          'hp-down': 'diff-hp-down', 'hp-up': 'diff-hp-up',
          'appear': 'diff-appear', 'destroyed': 'diff-destroyed',
          'shield-up': 'diff-shield-up', 'shield-down': 'diff-shield-down',
          'cauldron': 'diff-cauldron', 'shelf': 'diff-shelf',
          'shared': 'diff-shared', 'none': 'diff-none'
        }[chip.kind] || 'diff-shared';
        const nameHtml = chip.name ? `<span class="diff-chip-name">《${escapeHtml(chip.name)}》</span>` : '';
        const detailHtml = chip.detail ? `<span class="font-black">${escapeHtml(chip.detail)}</span>` : '';
        return `<span class="diff-chip ${kindClass}"><span>${escapeHtml(chip.label)}</span>${nameHtml}${detailHtml}</span>`;
      }).join('');
      document.getElementById('changesIntervalLabel').textContent =
        INTERVAL_BASE ? `自分の手番終了 → 今の手番開始（第${G.turn}ターン）` : '自分の手番終了 → 今の手番開始';
      // 下段：区間の出来事（時系列・全ログ通し番号つき、直近優先）
      const intervalEvents = getIntervalEvents();
      const timelineEl = document.getElementById('changesTimeline');
      if (intervalEvents.total === 0) {
        timelineEl.innerHTML = '<div class="py-0.5 text-slate-400">この区間で起きた出来事はまだありません</div>';
      } else {
        timelineEl.innerHTML = intervalEvents.shown.map((e, i) => {
          const isLatest = i === intervalEvents.shown.length - 1;
          return `<div class="changes-timeline-row${isLatest ? ' is-latest' : ''}"><span class="changes-timeline-num">${e.num}.</span><span class="changes-timeline-text">${escapeHtml(e.text)}</span></div>`;
        }).join('');
      }
      document.getElementById('changesTimelineCount').textContent =
        intervalEvents.total > 0 ? `全${intervalEvents.total}件${intervalEvents.hiddenCount > 0 ? `・直近${intervalEvents.shown.length}件を表示` : ''}` : '';
      document.getElementById('changesMoreNote').textContent =
        intervalEvents.hiddenCount > 0
          ? `ほか${intervalEvents.hiddenCount}件は、下の「ログ」を開くと全件（通し番号つき）で確認できます。`
          : (intervalEvents.total > 0 ? '全件を表示しています。全対戦の流れは下の「ログ」でも確認できます。' : '');

      // 4. 行動選択肢
      const sideLabel = G.humanSide === 0 ? '先攻' : '後攻';
      document.getElementById('lastStepSummary').textContent = G.lastSummary;
      const actionListEl = document.getElementById('actionList');

      if (G.phase === 'gameover') {
        const isHumanWin = G.winner === G.humanSide;
        const curSeed = Math.max(1, Math.min(200, Number(document.getElementById('rngStartInput').value) || 1));
        if (PENDING_FRESH_SEED === null || PENDING_FRESH_SEED === curSeed) {
          let n = curSeed;
          while (n === curSeed) n = Math.floor(Math.random() * 200) + 1;
          PENDING_FRESH_SEED = n;
        }
        document.getElementById('phaseHeading').textContent = `試合終了（第${G.turn}ターン）`;
        actionListEl.innerHTML = `
          <div class="rounded-lg border ${isHumanWin ? 'border-emerald-500 bg-emerald-950/50' : 'border-rose-500 bg-rose-950/50'} p-3 text-center space-y-2">
            <div class="text-base font-black ${isHumanWin ? 'text-emerald-300' : 'text-rose-300'}">
              ${isHumanWin ? '🏆 あなたの勝利！' : '💀 相手の勝利…'}（${G.winner === 0 ? '先攻' : '後攻'}勝利）
            </div>
            <div class="text-xs text-slate-300">理由：${escapeHtml(G.winReason)} ／ 最終HP：あなた ${G.players[G.humanSide].hp} vs 相手 ${G.players[oppSide].hp}</div>
            <button type="button" onclick="startFreshGame()" class="px-4 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs">新しく始める（別の乱数・開始位置 ${PENDING_FRESH_SEED}）</button>
          </div>
        `;
      } else {
        document.getElementById('phaseHeading').textContent = `第${G.turn}ターン・行動フェイズ（${sideLabel}）`;
        const actions = getLegalActions(G, G.humanSide);
        actionListEl.innerHTML = actions.map((act, idx) => {
          const num = idx + 1;
          if (act.isThreeLine) {
            return `
              <button type="button" onclick="handlePlayerAction(${idx})" class="action-item w-full text-left rounded border border-slate-700/80 bg-[#0f172a]/85 px-2 py-1 flex items-start gap-1.5">
                <span class="font-extrabold text-slate-300 shrink-0">${num}.</span>
                <div class="leading-snug space-y-0.5 min-w-0">
                  <div>${act.line1}</div>
                  <div class="text-[11px] text-slate-300 pl-2">${act.line2}</div>
                  <div class="text-[11px] text-slate-300 pl-2">${act.line3}</div>
                </div>
              </button>
            `;
          }
          return `
            <button type="button" onclick="handlePlayerAction(${idx})" class="action-item w-full text-left rounded border border-slate-700/80 bg-[#0f172a]/85 px-2 py-1 flex items-start gap-1.5">
              <span class="font-extrabold text-slate-300 shrink-0">${num}.</span>
              <span class="leading-snug">${act.html}</span>
            </button>
          `;
        }).join('');
      }

      // 検証ツールバー状態更新
      document.getElementById('btnVisibility').textContent = `手札：${PUBLIC_MODE ? '公開' : '非公開'}`;
      document.getElementById('btnSide').textContent = `あなた：${PLAYER_IS_FIRST ? '先攻' : '後攻'}`;
      document.getElementById('btnUndo').disabled = HISTORY.length === 0;
      // ログは記録として、最初から順に番号付きで全件表示（読み返すためのもの）
      const chronological = [...G.logs].reverse();
      const logEl = document.getElementById('logContent');
      logEl.innerHTML = chronological.map((l, i) => `<div class="border-b border-slate-800/80 py-0.5"><span class="text-slate-500">${i + 1}.</span> ${escapeHtml(l)}</div>`).join('');
      logEl.scrollTop = logEl.scrollHeight;
    }

    // =========================================================================
    // 13. ポップアップ・検証ツール操作
    // =========================================================================
    function showCardDetail(uid) {
      const c = getCard(G, uid);
      const def = CARD_DEFS[c.name];
      document.getElementById('detailTitle').innerHTML = `${getColorDot(c.name)}《${formatColoredCardName(c.name)}》`;
      document.getElementById('detailSub').textContent = `物理ID:#${c.uid}(${c.displayId}) ／ 所属:${def.system} ／ 盾:${c.shields}`;
      document.getElementById('detailDesc').textContent = def.summary;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function showCauldronDetail(side) {
      const p = G.players[side];
      const lines = p.cauldrons.map((caul, i) => {
        const upg = caul.upgrades.map(id => alcLabel(getCard(G, id).name)).join(', ') || 'なし';
        const att = caul.attachments.map(id => `${getCard(G, id).name}(${CARD_DEFS[getCard(G, id).name].label})`).join(', ') || 'なし';
        const cnt = caul.contents.map(id => alcLabel(getCard(G, id).name)).join(', ') || 'なし';
        return `【第${i + 1}釜】器:${alcLabel(getCard(G, caul.potUid).name)} ／ 強化:${upg} ／ 付属:${att} ／ 中身:${cnt}`;
      });
      if (p.shelf) {
        lines.push(`【保管棚】強化:${p.shelf.upgrades.map(id => alcLabel(getCard(G, id).name)).join(', ') || 'なし'}／中身:${p.shelf.contents.map(id => alcLabel(getCard(G, id).name)).join(', ') || 'なし'}`);
      }
      document.getElementById('detailTitle').textContent = `🟡 ${side === 0 ? '先攻' : '後攻'}の錬成領域詳細`;
      document.getElementById('detailSub').textContent = `全${p.cauldrons.length}器`;
      document.getElementById('detailDesc').textContent = lines.join('\n');
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function showSharedDetail() {
      const discardList = G.discard.length > 0 ? G.discard.map((id, i) => `${i + 1}. ${getCard(G, id).displayId}`).join(' / ') : 'なし';
      const deckInfo = PUBLIC_MODE ? G.deck.map(id => getCard(G, id).displayId).join(' / ') : `非公開（残り${G.deck.length}枚）`;
      document.getElementById('detailTitle').textContent = '共有領域・待機在庫詳細';
      document.getElementById('detailSub').textContent = `乱数位置:${G.rngPos}`;
      document.getElementById('detailDesc').textContent =
        `【共有捨て札（上から順）】${discardList}\n` +
        `【共有デッキ】${deckInfo}\n` +
        `【待機残数】基本:${G.standbyBase.length}枚 ／ 錬成:${G.standbyAlc.length}枚 ／ 供物:${G.standbyOff.length}枚`;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function togglePublicMode() {
      PUBLIC_MODE = !PUBLIC_MODE;
      render();
    }

    function togglePlayerFirst() {
      PLAYER_IS_FIRST = !PLAYER_IS_FIRST;
      startNewGame();
    }

    function toggleLog() {
      document.getElementById('logDrawer').classList.toggle('hidden');
    }

    function undoStep() {
      if (HISTORY.length === 0) return;
      G = JSON.parse(HISTORY.pop());
      BASELINE = JSON.parse(JSON.stringify(G));
      INTERVAL_BASE = JSON.parse(JSON.stringify(G));
      INTERVAL_LOG_LEN = G.logs.length;
      INTERVAL_END_BASE = JSON.parse(JSON.stringify(G));
      INTERVAL_LOG_END = G.logs.length;
      closeDetail();
      render();
    }

    function startNewGame() {
      HISTORY = [];
      PENDING_FRESH_SEED = null;
      closeDetail();
      const rngStart = document.getElementById('rngStartInput').value;
      G = initGame(rngStart, PLAYER_IS_FIRST);
      // 後攻スタート時は、相手の初手＋自分の開始フェイズを最初の区間として見せるため、開始直後を区間の起点にする
      if (!PLAYER_IS_FIRST) {
        INTERVAL_BASE = JSON.parse(JSON.stringify(G));
        INTERVAL_LOG_LEN = G.logs.length;
      }
      beginActiveTurn(G);
      if (!PLAYER_IS_FIRST && G.phase !== 'gameover') {
        runCpuActionPhase(G, 0);
        if (G.phase !== 'gameover') advanceUntilHumanTurn();
      }
      // 先攻スタート時は、最初の判断時点ではまだ区間が無い（相手の手番が来ていない）状態にする
      if (PLAYER_IS_FIRST) {
        INTERVAL_BASE = JSON.parse(JSON.stringify(G));
        INTERVAL_LOG_LEN = G.logs.length;
        INTERVAL_END_BASE = JSON.parse(JSON.stringify(G));
        INTERVAL_LOG_END = G.logs.length;
      }
      BASELINE = JSON.parse(JSON.stringify(G));
      render();
    }

    // 終了後の再開用：いまとは違う乱数開始位置を自動で選んで新しく始める
    function startFreshGame() {
      const input = document.getElementById('rngStartInput');
      const curSeed = Math.max(1, Math.min(200, Number(input.value) || 1));
      let next = PENDING_FRESH_SEED;
      if (next === null || next === curSeed) {
        next = curSeed;
        while (next === curSeed) next = Math.floor(Math.random() * 200) + 1;
      }
      input.value = next;
      startNewGame();
    }

    // =========================================================================
    // 14. 対戦データの受け渡し（書き出し・読み込み・単体HTML化）
    // =========================================================================
    function setShareStatus(msg) {
      document.getElementById('shareStatus').textContent = msg;
    }

    function toggleSharePanel() {
      document.getElementById('sharePanel').classList.toggle('hidden');
    }

    // 受け取ったデータを信用しないための検証とエスケープ。
    // カード名は固定マスターにあるものだけを許可し、数値項目は数値化し、UID配列は範囲内の整数だけに浄化する。
    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function validateImportedState(state) {
      if (!state || typeof state !== 'object') throw new Error('対戦データの形式が違います');
      if (!Array.isArray(state.cards) || state.cards.length === 0) throw new Error('カード情報がありません');
      state.cards.forEach((c, i) => {
        if (!c || typeof c.name !== 'string' || !CARD_DEFS[c.name]) throw new Error('未知のカード名が含まれています');
        if (c.code !== '' && c.code !== 'a' && c.code !== 'b') throw new Error('カードコードが不正です');
        c.uid = i + 1;
        c.displayId = c.code ? `${c.name}${c.code}` : c.name;
        c.shields = Number(c.shields) || 0;
        if (!Array.isArray(c.stackedCards)) c.stackedCards = [];
      });
      const okUid = u => Number.isInteger(u) && u >= 1 && u <= state.cards.length;
      const cleanUids = arr => (Array.isArray(arr) ? arr.filter(okUid) : []);
      if (!Array.isArray(state.players) || state.players.length !== 2) throw new Error('プレイヤー情報が不正です');
      state.players.forEach(p => {
        if (!p || typeof p !== 'object') throw new Error('プレイヤー情報が不正です');
        p.hp = Number(p.hp);
        if (!Number.isFinite(p.hp)) throw new Error('プレイヤー情報が不正です');
        p.hand = cleanUids(p.hand);
        p.field = cleanUids(p.field);
        p.altarUid = okUid(p.altarUid) ? p.altarUid : null;
        if (!Array.isArray(p.cauldrons) || p.cauldrons.length === 0) throw new Error('錬成釜の情報が不正です');
        p.cauldrons.forEach(caul => {
          caul.contents = cleanUids(caul.contents);
          caul.upgrades = cleanUids(caul.upgrades);
          caul.attachments = cleanUids(caul.attachments);
          if (!caul.attachmentActive || typeof caul.attachmentActive !== 'object') caul.attachmentActive = {};
        });
        if (p.shelf) { p.shelf.contents = cleanUids(p.shelf.contents); p.shelf.upgrades = cleanUids(p.shelf.upgrades); }
        p.alcDefenseShield = Number(p.alcDefenseShield) || 0;
      });
      ['deck', 'discard', 'standbyBase', 'standbyAlc', 'standbyOff'].forEach(k => { state[k] = cleanUids(state[k]); });
      state.cards.forEach(c => { c.stackedCards = cleanUids(c.stackedCards); });
      state.rngPos = Math.max(1, Math.min(200, Number(state.rngPos) || 1));
      state.turn = Math.max(1, Number(state.turn) || 1);
      state.humanSide = state.humanSide === 1 ? 1 : 0;
      state.activeSide = state.activeSide === 1 ? 1 : 0;
      state.winner = (state.winner === 0 || state.winner === 1) ? state.winner : null;
      state.noChangeTurns = Number(state.noChangeTurns) || 0;
      state.winReason = String(state.winReason || '');
      state.lastSummary = String(state.lastSummary || '');
      state.logs = (Array.isArray(state.logs) ? state.logs : []).map(l => String(l));
      return state;
    }

    function collectSaveData() {
      return {
        app: 'senkyofuda-x-rensei-x-kumotsu-sim',
        version: 1,
        savedAt: new Date().toISOString(),
        publicMode: PUBLIC_MODE,
        playerIsFirst: PLAYER_IS_FIRST,
        rngStartInput: document.getElementById('rngStartInput').value,
        state: G,
        history: HISTORY
      };
    }

    function applySaveData(data) {
      if (!data || !data.state) throw new Error('対戦データの形式が違います');
      G = validateImportedState(data.state);
      const cleanedHistory = [];
      (Array.isArray(data.history) ? data.history : []).forEach(h => {
        try { cleanedHistory.push(JSON.stringify(validateImportedState(JSON.parse(h)))); } catch (e) { /* 不正な履歴は捨てる */ }
      });
      HISTORY = cleanedHistory.slice(-40);
      PUBLIC_MODE = !!data.publicMode;
      PLAYER_IS_FIRST = data.playerIsFirst !== false;
      if (data.rngStartInput != null) document.getElementById('rngStartInput').value = Math.max(1, Math.min(200, Number(data.rngStartInput) || 1));
      PENDING_FRESH_SEED = null;
      BASELINE = JSON.parse(JSON.stringify(G));
      INTERVAL_BASE = JSON.parse(JSON.stringify(G));
      INTERVAL_LOG_LEN = G.logs.length;
      INTERVAL_END_BASE = JSON.parse(JSON.stringify(G));
      INTERVAL_LOG_END = G.logs.length;
      closeDetail();
      render();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function exportSaveJson() {
      const json = JSON.stringify(collectSaveData());
      downloadBlob(new Blob([json], { type: 'application/json' }), 'senkyofuda-match.json');
      setShareStatus('対戦データをJSONファイルで書き出しました。受け取った人は、このページの「データ受け渡し」→「ファイルから読み込む」で続きを遊べます。');
    }

    async function copySaveJson() {
      const json = JSON.stringify(collectSaveData());
      try {
        await navigator.clipboard.writeText(json);
        setShareStatus('対戦データをコピーしました。相手に送り、このページの貼り付け欄に貼ってもらえば続きを遊べます。');
      } catch (e) {
        const ta = document.getElementById('importTextArea');
        ta.value = json;
        ta.select();
        setShareStatus('自動コピーができなかったため、貼り付け欄にデータを表示しました。そのままコピーして相手に送ってください。');
      }
    }

        return;
      }
      const styleText = document.querySelector('style').textContent;
      const scriptText = document.getElementById('mainScript').textContent;
      const bodyClone = document.body.cloneNode(true);
      bodyClone.querySelectorAll('script').forEach(s => s.remove());
      const saveJson = JSON.stringify(collectSaveData()).replace(/<\//g, '<\\/');
      const html = '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8" />\n' +
        '<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n' +
        '<title>『千響札×錬成×供物』単体シミュレーター（対戦データ入り）</title>\n' +
        '<link rel="preconnect" href="https://fonts.googleapis.com" />\n' +
        '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />\n' +
        '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />\n' +
        '<style>\n' + cssText + '\n</style>\n<style>\n' + styleText + '\n</style>\n' +
        '<link rel="icon" href="data:," />\n</head>\n' +
        '<body class="p-1.5 pb-6 flex justify-center">\n' + bodyClone.innerHTML + '\n' +
        '<script>window.__EMBEDDED_SAVE__ = ' + saveJson + ';<\/script>\n' +
        '<script>\n' + scriptText + '\n<\/script>\n</body>\n</html>';
      downloadBlob(new Blob([html], { type: 'text/html' }), 'senkyofuda-simulator.html');
      setShareStatus('単体HTMLを書き出しました。このファイル1つを渡せば、相手はブラウザで開いて、書き出し時点の対戦からそのまま遊べます。');
    }

    function importSaveFromFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applySaveData(JSON.parse(reader.result));
          setShareStatus('ファイルを読み込みました。対戦の続きから遊べます。');
        } catch (e) {
          setShareStatus('読み込みに失敗しました：' + e.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function importSaveFromText() {
      const text = document.getElementById('importTextArea').value.trim();
      if (!text) { setShareStatus('貼り付け欄が空です。受け取ったデータを貼り付けてください。'); return; }
      try {
        applySaveData(JSON.parse(text));
        setShareStatus('データを読み込みました。対戦の続きから遊べます。');
      } catch (e) {
        setShareStatus('読み込みに失敗しました：' + e.message);
      }
    }

    window.onload = function () {
      if (window.__EMBEDDED_SAVE__) {
        try {
          applySaveData(window.__EMBEDDED_SAVE__);
          return;
        } catch (e) { /* 埋め込みデータが壊れていれば通常開始にフォールバック */ }
      }
      startNewGame();
    };
  </script>
</body>
</html>
