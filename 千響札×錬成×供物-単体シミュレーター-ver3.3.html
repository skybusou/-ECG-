            <span class="text-slate-500">／</span>
            <span>共有捨て札：<strong class="text-white">${G.discard.length}枚</strong><span class="text-slate-400">${discardSummary}</span></span>
            <span class="text-slate-500">／</span>
            <span>
              待機在庫：基本 <strong class="text-white">${G.standbyBase.length}枚</strong> ｜
              🟡<span class="text-[#eab308] font-bold">錬成</span> <strong class="text-[#eab308]">${G.standbyAlc.length}枚</strong> ｜
              🩸<span class="text-[#fb7185] font-bold">供物</span> <strong class="text-[#fb7185]">${G.standbyOff.length}枚</strong>
              <span class="text-slate-400 ml-1">[乱数位置:${G.rngPos}]</span>
            </span>
          </button>
        </div>
      `;

      // 2. 相手パネル & 3. 自分パネル
      document.getElementById('oppPanel').innerHTML = renderPlayerBlock(oppSide, true);
      document.getElementById('mePanel').innerHTML = renderPlayerBlock(G.humanSide, false);

      // 4. 行動選択肢
      const sideLabel = G.humanSide === 0 ? '先攻' : '後攻';
      document.getElementById('lastStepSummary').textContent = G.lastSummary;
      const actionListEl = document.getElementById('actionList');

      if (G.phase === 'gameover') {
        const isHumanWin = G.winner === G.humanSide;
        document.getElementById('phaseHeading').textContent = `試合終了（第${G.turn}ターン）`;
        actionListEl.innerHTML = `
          <div class="rounded-lg border ${isHumanWin ? 'border-emerald-500 bg-emerald-950/50' : 'border-rose-500 bg-rose-950/50'} p-3 text-center space-y-2">
            <div class="text-base font-black ${isHumanWin ? 'text-emerald-300' : 'text-rose-300'}">
              ${isHumanWin ? '🏆 あなたの勝利！' : '💀 相手の勝利…'}（${G.winner === 0 ? '先攻' : '後攻'}勝利）
            </div>
            <div class="text-xs text-slate-300">理由：${G.winReason} ／ 最終HP：あなた ${G.players[G.humanSide].hp} vs 相手 ${G.players[oppSide].hp}</div>
            <button type="button" onclick="startNewGame()" class="px-4 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs">同じ乱数位置で再戦する</button>
          </div>
        `;
      } else {
        document.getElementById('phaseHeading').textContent = `第${G.turn}ターン・行動フェイズ（${sideLabel}）`;
        const actions = getLegalActions(G, G.humanSide);
        actionListEl.innerHTML = actions.map((act, idx) => {
          const num = idx + 1;
          if (act.isThreeLine) {
            return `
              <button type="button" onclick="handlePlayerAction(${idx})" class="action-item w-full text-left rounded border border-slate-700/80 bg-[#0f172a]/85 px-2 py-1 flex items-start gap-1.5">
                <span class="font-extrabold text-slate-300 shrink-0">${num}.</span>
                <div class="leading-snug space-y-0.5 min-w-0">
                  <div>${act.line1}</div>
                  <div class="text-[11px] text-slate-300 pl-2">${act.line2}</div>
                  <div class="text-[11px] text-slate-300 pl-2">${act.line3}</div>
                </div>
              </button>
            `;
          }
          return `
            <button type="button" onclick="handlePlayerAction(${idx})" class="action-item w-full text-left rounded border border-slate-700/80 bg-[#0f172a]/85 px-2 py-1 flex items-start gap-1.5">
              <span class="font-extrabold text-slate-300 shrink-0">${num}.</span>
              <span class="leading-snug">${act.html}</span>
            </button>
          `;
        }).join('');
      }

      // 検証ツールバー状態更新
      document.getElementById('btnVisibility').textContent = `手札：${PUBLIC_MODE ? '公開' : '非公開'}`;
      document.getElementById('btnSide').textContent = `あなた：${PLAYER_IS_FIRST ? '先攻' : '後攻'}`;
      document.getElementById('btnUndo').disabled = HISTORY.length === 0;
      document.getElementById('logContent').innerHTML = G.logs.map(l => `<div class="border-b border-slate-800/80 py-0.5">${l}</div>`).join('');
    }

    // =========================================================================
    // 13. ポップアップ・検証ツール操作
    // =========================================================================
    function showCardDetail(uid) {
      const c = getCard(G, uid);
      const def = CARD_DEFS[c.name];
      document.getElementById('detailTitle').innerHTML = `${getColorDot(c.name)}《${formatColoredCardName(c.name)}》`;
      document.getElementById('detailSub').textContent = `物理ID:#${c.uid}(${c.displayId}) ／ 所属:${def.system} ／ 盾:${c.shields}`;
      document.getElementById('detailDesc').textContent = def.summary;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function showCauldronDetail(side) {
      const p = G.players[side];
      const lines = p.cauldrons.map((caul, i) => {
        const upg = caul.upgrades.map(id => getCard(G, id).name).join(', ') || 'なし';
        const att = caul.attachments.map(id => `${getCard(G, id).name}(${CARD_DEFS[getCard(state, id).name].label})`).join(', ') || 'なし';
        const cnt = caul.contents.map(id => getCard(G, id).name).join(', ') || 'なし';
        return `【第${i + 1}釜】器:${getCard(G, caul.potUid).name} ／ 強化:${upg} ／ 付属:${att} ／ 中身:${cnt}`;
      });
      if (p.shelf) {
        lines.push(`【保管棚】中身:${p.shelf.contents.map(id => getCard(G, id).name).join(', ') || 'なし'}`);
      }
      document.getElementById('detailTitle').textContent = `🟡 ${side === 0 ? '先攻' : '後攻'}の錬成領域詳細`;
      document.getElementById('detailSub').textContent = `全${p.cauldrons.length}器`;
      document.getElementById('detailDesc').textContent = lines.join('\n');
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function showSharedDetail() {
      const discardList = G.discard.length > 0 ? G.discard.map((id, i) => `${i + 1}. ${getCard(G, id).displayId}`).join(' / ') : 'なし';
      const deckInfo = PUBLIC_MODE ? G.deck.map(id => getCard(G, id).displayId).join(' / ') : `非公開（残り${G.deck.length}枚）`;
      document.getElementById('detailTitle').textContent = '共有領域・待機在庫詳細';
      document.getElementById('detailSub').textContent = `乱数位置:${G.rngPos}`;
      document.getElementById('detailDesc').textContent =
        `【共有捨て札（上から順）】${discardList}\n` +
        `【共有デッキ】${deckInfo}\n` +
        `【待機残数】基本:${G.standbyBase.length}枚 ／ 錬成:${G.standbyAlc.length}枚 ／ 供物:${G.standbyOff.length}枚`;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function togglePublicMode() {
      PUBLIC_MODE = !PUBLIC_MODE;
      render();
    }

    function togglePlayerFirst() {
      PLAYER_IS_FIRST = !PLAYER_IS_FIRST;
      startNewGame();
    }

    function toggleLog() {
      document.getElementById('logDrawer').classList.toggle('hidden');
    }

    function undoStep() {
      if (HISTORY.length === 0) return;
      G = JSON.parse(HISTORY.pop());
      closeDetail();
      render();
    }

    function startNewGame() {
      HISTORY = [];
      closeDetail();
      const rngStart = document.getElementById('rngStartInput').value;
      G = initGame(rngStart, PLAYER_IS_FIRST);
      beginActiveTurn(G);
      if (!PLAYER_IS_FIRST && G.phase !== 'gameover') {
        runCpuActionPhase(G, 0);
        if (G.phase !== 'gameover') advanceUntilHumanTurn();
      }
      render();
    }

    window.onload = function () {
      startNewGame();
    };
  </script>
</body>
</html>
